org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
android.nonTransitiveRClass=true
android.useAndroidX=true

# Version: Tag v<versionName> muss dazu passen; versionCode bei jedem Release erhoehen (nie zurueck).
sofahub.versionName=1.0.8
sofahub.versionCode=18

# Quelle der In-App-Updates (GitHub Releases, owner/repo). Private Forks: Token in der App hinterlegen.
sofahub.updateRepo=thisislennard/SofaHub
