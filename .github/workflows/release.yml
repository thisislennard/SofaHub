name: Release

# Alternative zu scripts/publish_release.py: nur manuell auslösbar und nur, wenn die Signing-Secrets hinterlegt sind
# (docs/RELEASING.md). Der Tag muss existieren und zu sofahub.versionName in gradle.properties passen.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Bereits vorhandener Tag, z. B. v1.2.0"
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: release
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # Runner fuer private Repos haben 7 GB: mehr Gradle-Heap, Kotlin im selben Prozess, max. 2 Worker.
      - name: Gradle-Speicher fuer CI
        run: |
          printf '\norg.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8\nkotlin.compiler.execution.strategy=in-process\norg.gradle.workers.max=2\n' >> gradle.properties

      - name: Version prüfen
        run: |
          name=$(grep '^sofahub.versionName=' gradle.properties | cut -d= -f2)
          code=$(grep '^sofahub.versionCode=' gradle.properties | cut -d= -f2)
          test "v$name" = "$TAG" || { echo "Tag $TAG passt nicht zu versionName $name"; exit 1; }
          echo "$code" | grep -Eq '^[1-9][0-9]*$' || { echo "versionCode ungültig"; exit 1; }

      - name: Tests und Lint
        run: ./gradlew --no-daemon testDebugUnitTest lintRelease

      - name: Keystore bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.SOFAHUB_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Secret SOFAHUB_KEYSTORE_BASE64 fehlt"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sofahub-release.jks"

      - name: Signierte Release-APK bauen
        env:
          SOFAHUB_KEYSTORE_FILE: ${{ runner.temp }}/sofahub-release.jks
          SOFAHUB_KEYSTORE_PASSWORD: ${{ secrets.SOFAHUB_KEYSTORE_PASSWORD }}
          SOFAHUB_KEY_ALIAS: ${{ secrets.SOFAHUB_KEY_ALIAS }}
          SOFAHUB_KEY_PASSWORD: ${{ secrets.SOFAHUB_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Assets erzeugen und prüfen (Signatur, Paket, Version, Hash)
        run: python3 scripts/make_release_assets.py --apk app/build/outputs/apk/release/app-release.apk --out dist --tag "$TAG"

      - name: Keystore entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/sofahub-release.jks"

      # Erst als Entwurf mit allen Assets anlegen, dann veröffentlichen: so ist ein Release nie halb sichtbar.
      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/release-notes/$TAG.md"
          test -f "$notes" || { echo "Release Notes $notes fehlen"; exit 1; }
          gh release create "$TAG" dist/SofaHub-*-universal.apk dist/update.json dist/SHA256SUMS \
            --draft --title "Sofa Hub ${TAG#v}" --notes-file "$notes" --verify-tag
          gh release edit "$TAG" --draft=false --latest
